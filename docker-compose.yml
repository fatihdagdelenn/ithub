services:
  ithub:
    build: .
    image: it-system-management-hub:latest
    container_name: ithub
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      DATABASE_URL: "file:/app/data/ithub.db"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required - set it in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ithub-data:/app/data

volumes:
  ithub-data:
